<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narayah Governance v0.1.0 — Unified Gridstack Workspace Testbed</title>
    
    <!-- External CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack.min.css" rel="stylesheet"/>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* CONTROL PANEL SIDEBAR */
        #control-sidebar {
            width: 340px;
            background-color: #181818;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            background-color: #0d0d0d;
            border-bottom: 1px solid #2a2a2a;
        }

        .sidebar-header h1 {
            margin: 0;
            font-size: 1.25rem;
            color: #ff7b00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .codex-instruction {
            font-size: 11px;
            color: #aaa;
            line-height: 1.5;
            background-color: #202020;
            padding: 10px;
            border-left: 3px solid #ff7b00;
            border-radius: 2px;
        }

        .vde-action-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-sacred {
            background: #ff7b00;
            color: #fff;
            border: none;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .btn-sacred:hover {
            background: #e06c00;
            color: #fff;
        }

        .btn-secondary-vde {
            background: #252525;
            color: #ccc;
            border: 1px solid #444;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary-vde:hover {
            background: #333;
            color: #fff;
            border-color: #ff7b00;
        }

        .vde-state-area {
            background: #0d0d0d;
            color: #00ff66;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 11px;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 10px;
            height: 180px;
            resize: none;
            width: 100%;
            box-sizing: border-box;
        }

        /* WORKSPACE CANVAS AREA */
        #vde-workspace-canvas {
            flex-grow: 1;
            position: relative;
            background-color: #101010;
            background-image: radial-gradient(#252525 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            padding: 25px;
            overflow-y: auto;
            height: 100%;
        }

        /* Gridstack Darkness Style Corrections */
        .grid-stack {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            min-height: 120px;
            border: 1px dashed #222;
        }

        .grid-stack-item-content {
            border-radius: 4px;
        }

        /* Markdown elements inside panels */
        .vde-markdown-preview h1, 
        .vde-markdown-preview h2, 
        .vde-markdown-preview h3 {
            color: #ff7b00;
            margin-top: 5px;
            margin-bottom: 8px;
        }

        .vde-markdown-preview blockquote {
            border-left: 3px solid #ff7b00;
            margin: 10px 0;
            padding-left: 10px;
            color: #999;
            font-style: italic;
            background: #181818;
            padding-top: 4px;
            padding-bottom: 4px;
        }

        .vde-markdown-preview pre {
            background-color: #151515;
            padding: 8px;
            border-radius: 3px;
            overflow-x: auto;
            border: 1px solid #2a2a2a;
        }

        .vde-markdown-preview code {
            font-family: 'Consolas', monospace;
            color: #ffaa44;
            font-size: 11px;
        }

        .vde-markdown-preview ul {
            padding-left: 18px;
            margin: 5px 0;
        }

        .vde-markdown-preview li {
            margin-bottom: 3px;
        }

        /* Custom scrollbar behavior for dark UI */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #101010;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff7b00;
        }
    </style>
</head>
<body>

    <!-- CONTROL PANEL SIDEBAR -->
    <div id="control-sidebar">
        <div class="sidebar-header">
            <h1>Narayah VDE</h1>
            <div style="font-size: 10px; color: #666; margin-top: 4px;">Virtue Execution Matrix // v0.1.0 OOP</div>
        </div>
        
        <div class="sidebar-content">
            <div class="codex-instruction">
                <i class="bi bi-info-circle-fill text-warning me-1"></i>
                <strong>Clerical Instruction:</strong> Add modular <em>Buckets</em> to isolate workspaces. Create panels, duplicate them via Clone (📋), or divide them via Digest (✂️). Drag panels between buckets to organize.
            </div>
        
            <div class="vde-action-group">
                <button class="btn btn-sacred" id="summon-bucket-btn">
                    <i class="bi bi-folder-plus me-1"></i> Summon New Bucket
                </button>
                <button class="btn btn-secondary-vde" id="add-markdown-btn">
                    <i class="bi bi-file-earmark-text-fill text-warning"></i> + Add Markdown Codex
                </button>
                <button class="btn btn-secondary-vde" id="add-dashboard-btn">
                    <i class="bi bi-file-earmark-bar-graph text-warning"></i> + Add Data Viz Dashboard
                </button>
                <button class="btn btn-secondary-vde" id="add-code-btn">
                    <i class="bi bi-code-slash me-1 text-warning"></i> + Add Code Snippet
                </button>
                <div class="input-group input-group-sm mt-1">
                    <span class="input-group-text bg-dark border-secondary text-muted font-monospace" style="font-size:10px;">Target Bucket</span>
                    <select class="form-select bg-dark text-white border-secondary" id="target-bucket-select"></select>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #2a2a2a; margin: 10px 0;">

            <div style="font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px;">JSON Shadow State Config</div>
            <textarea class="vde-state-area" id="vde-json-io" placeholder="{ VDE JSON State Payload }"></textarea>
            
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-secondary-vde" id="export-vde-btn" style="flex: 1; justify-content: center;">
                    <i class="bi bi-download"></i> Export
                </button>
                <button class="btn btn-secondary-vde" id="import-vde-btn" style="flex: 1; justify-content: center; border-color: #4CAF50; color: #4CAF50;">
                    <i class="bi bi-upload"></i> Import
                </button>
            </div>
            
            <button class="btn btn-secondary-vde" id="clear-all-btn" style="border-color: #f44336; color: #f44336; width: 100%; justify-content: center;">
                <i class="bi bi-trash3"></i> Clear Workspace
            </button>
        </div>
    </div>

    <!-- WORKSPACE CANVAS AREA -->
    <div id="vde-workspace-canvas"></div>

    <!-- SUMMON BUCKET MODAL -->
    <div class="modal fade" id="summonBucketModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning font-monospace"><i class="bi bi-folder-plus me-1"></i> Summon Workspace Bucket</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label font-monospace text-muted small">Bucket Name</label>
                        <input type="text" class="form-control bg-secondary text-white border-secondary" id="modal-bucket-name" value="Data Sanctuary">
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label font-monospace text-muted small">Columns (1-12)</label>
                            <input type="number" class="form-control bg-secondary text-white border-secondary" id="modal-bucket-cols" value="12" min="1" max="12">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label font-monospace text-muted small">Cell Height (px)</label>
                            <input type="number" class="form-control bg-secondary text-white border-secondary" id="modal-bucket-height" value="25">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label font-monospace text-muted small">Margin (px)</label>
                            <input type="number" class="form-control bg-secondary text-white border-secondary" id="modal-bucket-margin" value="5">
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-sm btn-warning" id="modal-create-bucket-btn">Summon</button>
                </div>
            </div>
        </div>
    </div>

    <!-- DEPENDENCY INJECTIONS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-cloud@1.2.5/build/d3.layout.cloud.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack-all.js"></script>

    <!-- MODULAR PLUG-AND-PLAY ARCHITECTURE SCRIPTS -->
    <script src="vde-adapters.js"></script>
    <script src="vde-digester.js"></script>
    <script src="vde-charts.js"></script>
    <script src="vde-content.js"></script>
    <script src="vde-core.js"></script>

    <!-- VDE INITIALIZATION & EVENT BINDINGS -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Bind IntegratedGridManager to the workspace canvas
            IntegratedGridManager.setContainer("#vde-workspace-canvas");

            const jsonArea = document.getElementById("vde-json-io");
            const targetBucketSelect = document.getElementById("target-bucket-select");
            const summonModalEl = document.getElementById("summonBucketModal");
            const bsModal = new bootstrap.Modal(summonModalEl);

            // Helper: Synchronize target bucket options in sidebar select dropdown
            function syncBucketDropdown() {
                targetBucketSelect.innerHTML = "";
                if (IntegratedGridManager.buckets.size === 0) {
                    const opt = document.createElement("option");
                    opt.value = "";
                    opt.textContent = "-- No Buckets Available --";
                    targetBucketSelect.appendChild(opt);
                    return;
                }

                IntegratedGridManager.buckets.forEach((bucket, id) => {
                    const opt = document.createElement("option");
                    opt.value = id;
                    opt.textContent = `${bucket.name} (ID: ${id})`;
                    targetBucketSelect.appendChild(opt);
                });
            }

            // Listen for VDE state changes (updates JSON preview and dropdowns)
            IntegratedGridManager.stateChangeListener = (jsonState) => {
                if (jsonArea) jsonArea.value = jsonState;
                syncBucketDropdown();
            };

            // Helper: Fetch selected target bucket ID
            function getSelectedBucketId() {
                const val = targetBucketSelect.value;
                return val ? parseInt(val, 10) : null;
            }

            // 2. UI Event Handlers
            
            // Open Summon Bucket Modal
            document.getElementById("summon-bucket-btn").addEventListener("click", () => {
                bsModal.show();
            });

            // Create Bucket from Modal Inputs
            document.getElementById("modal-create-bucket-btn").addEventListener("click", () => {
                const name = document.getElementById("modal-bucket-name").value || "Data Sanctuary";
                const cols = parseInt(document.getElementById("modal-bucket-cols").value, 10) || 12;
                const height = parseInt(document.getElementById("modal-bucket-height").value, 10) || 25;
                const margin = parseInt(document.getElementById("modal-bucket-margin").value, 10) || 5;

                IntegratedGridManager.createBucket(name, {
                    column: cols,
                    cellHeight: height,
                    margin: margin
                });

                bsModal.hide();
            });

            // Widget Addition Buttons
            document.getElementById("add-markdown-btn").addEventListener("click", () => {
                IntegratedGridManager.addMarkdownWidget("", getSelectedBucketId());
            });

            document.getElementById("add-dashboard-btn").addEventListener("click", () => {
                IntegratedGridManager.addDashboardWidget(getSelectedBucketId());
            });

            document.getElementById("add-code-btn").addEventListener("click", () => {
                IntegratedGridManager.addCodeWidget("", getSelectedBucketId());
            });

            // Export / Import / Clear Workspace Controls
            document.getElementById("export-vde-btn").addEventListener("click", () => {
                const jsonState = IntegratedGridManager.exportVDE();
                if (jsonArea) jsonArea.value = jsonState;
            });

            document.getElementById("import-vde-btn").addEventListener("click", () => {
                const jsonString = jsonArea.value;
                if (!jsonString) return;

                const success = IntegratedGridManager.importVDE(jsonString);
                if (!success) {
                    alert("Import Failed: Invalid VDE JSON payload structure.");
                }
            });

            document.getElementById("clear-all-btn").addEventListener("click", () => {
                if (confirm("Are you sure you want to clear the entire workspace? All buckets and panels will be removed.")) {
                    IntegratedGridManager.clearAll();
                }
            });

            // 3. Initialize Default Workspace Bucket
            IntegratedGridManager.createBucket("Primary Sanctuary", {
                column: 12,
                cellHeight: 25,
                margin: 5
            });
        });
    </script>

</body>
</html>
