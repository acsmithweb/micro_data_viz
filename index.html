<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Data Visualization Dashboard</title>

  <script src="https://d3js.org/d3.v6.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f8f9fa;
    }

    svg text {
      fill: black;
      font: 10px sans-serif;
    }

    .chart-container {
      width: 100%;
      height: 100%;
      min-height: 400px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      background: white;
      padding: 10px;
      position: relative;
      width: 100%;
      height: 500 px; /* example */
    }

    .control-row>* {
      margin-right: 10px;
      margin-bottom: 10px;
    }

    #global-state-card {
      position: fixed;
      top: 80px;
      /* adjust depending on your navbar height */
      left: 20px;
      width: 130px;
      /* fixed width so your layout stays stable */
      z-index: 1030;
      /* above normal content but below modals */
    }


    .table-scroll {
      position: absolute;
      overflow-y: auto;
      overflow-x: auto;
      background: white;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark navbar-expand-lg mb-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold">DataViz Dashboard</a>
      <button class="btn btn-success" id="add-panel-btn">+ New Panel</button>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">

      <!-- Left Sidebar -->
      <div class="col-2">
        <div class="card sticky-top">
          <div class="card-header fw-bold">Selected Graph Settings</div>
          <div class="card-body">

            <div class="mb-2">X-Axis: <span id="state-xAxis">(none)</span></div>
            <div class="mb-2">Y-Axis: <span id="state-yAxis">(none)</span></div>
            <div class="mb-2">Transform: <span id="state-agg">(none)</span></div>
            <div class="mb-2">Chart Type: <span id="state-chart">(none)</span></div>

            <hr>

            <div class="mb-2">Rows: <span id="state-rows">0</span></div>
            <div class="mb-2">Columns: <span id="state-cols">0</span></div>
          </div>
        </div>
      </div>

      <!-- Main Workspace -->
      <div class="col-10">
        <div id="panel-container"></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your scripts -->
  <script src="../HTML Dashboard Testing/js/chart-d3.js"></script>
  <script src="../HTML Dashboard Testing/js/chart-bar.js"></script>
  <script src="../HTML Dashboard Testing/js/chart-line.js"></script>
  <script src="../HTML Dashboard Testing/js/chart-stacked-bar.js"></script>
  <script src="../HTML Dashboard Testing/js/chart-pie.js"></script>
  <script src="../HTML Dashboard Testing/js/chart-table.js"></script>
  <script src="../HTML Dashboard Testing/js/Panel-Container.js"></script>
  <script src="../HTML Dashboard Testing/js/app.js"></script>


</body>

</html>
