<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VDE: The Far Realm - Rehydrated</title>
  <!-- Framework Dependencies -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@12.1.0/dist/gridstack.min.css" />

  <style>
    /* CSS Global & Layout */
    body { background: #f8f9fa; padding: 20px; }
    .bucket-wrapper { background: #fff; padding: 15px; border: 1px solid #dee2e6; border-radius: 8px; margin-bottom: 30px; }
    .grid-stack { background: #f1f3f5; border: 2px dashed #ced4da; min-height: 100px; }

    /* Widget Styling */
    .grid-stack-item-content {
      background: #0d6efd; color: white; display: flex; align-items: flex-start;
      justify-content: flex-start; border-radius: 4px; position: relative; overflow: hidden;
    }

    /* Widget Actions */
    .widget-action {
      position: absolute; top: 2px; cursor: pointer; font-size: 12px;
      background: rgba(0,0,0,0.5); border-radius: 50%; width: 18px; height: 18px;
      line-height: 16px; text-align: center; color: white; z-index: 10;
    }
    .remove-widget { right: 2px; }
    .edit-widget { right: 24px; }
    .save-widget { right: 24px; background: rgba(25, 135, 84, 0.9); }

    .widget-body { padding: 15px 10px 10px 10px; width: 100%; height: 100%; overflow: auto; }
    .widget-body pre { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 4px; color: #f8f9fa; margin: 0; }

    /* Editor Styling */
    .edit-textarea {
      width: 100%; height: 100%; box-sizing: border-box; padding: 25px 10px 10px 10px;
      border: none; outline: none; background: #e9ecef; color: #212529; resize: none; font-family: monospace;
    }
  </style>
</head>
<body>

  <!-- Interface Toolbar -->
  <div id="ui-injection-point">
    <div class="d-flex gap-2 mb-4 p-3 bg-white shadow-sm rounded align-items-center">
      <button class="btn btn-secondary" id="add-bucket">Add New Bucket</button>
      <textarea class="form-control w-25" id="widget-text" rows="1" placeholder="Widget content..."></textarea>
      <select class="form-select w-auto" id="widget-format">
        <option value="html">Rendered HTML</option>
        <option value="markdown">Markdown</option>
        <option value="code">Raw Code (JSON/Ruby/HTML)</option>
      </select>
      <button class="btn btn-success" id="add-widget">Add Widget</button>
      <button class="btn btn-primary ms-auto" data-bs-toggle="modal" data-bs-target="#jsonModal">JSON Utility</button>
    </div>
  </div>

  <div id="main-container"></div>

  <!-- Modals (JSON & Settings) -->
  <div id="modal-injection-point">
    <div class="modal fade" id="jsonModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">JSON Import/Export</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body"><textarea id="json-textarea" class="form-control" style="height:300px; font-family:monospace;"></textarea></div>
          <div class="modal-footer"><button class="btn btn-primary" id="export-json">Export</button><button class="btn btn-success" id="import-json">Import</button></div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="settingsModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Bucket Settings</h5></div>
          <div class="modal-body" id="settings-form-body"></div>
          <div class="modal-footer"><button class="btn btn-primary" id="save-settings">Save Changes</button></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gridstack@12.1.0/dist/gridstack-all.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    const mainContainer = document.getElementById('main-container');
    const settingsFormBody = document.getElementById('settings-form-body');
    const grids = [];
    let bucketCount = 0;
    let activeBucketId = null;

    const settingsFields = [
      { id: 'column', type: 'number', label: 'Columns' },
      { id: 'margin', type: 'number', label: 'Margin' },
      { id: 'cellHeight', type: 'number', label: 'Cell Height' },
      { id: 'enableResize', type: 'checkbox', label: 'Enable Resize' },
      { id: 'enableMove', type: 'checkbox', label: 'Enable Move' },
      { id: 'compact', type: 'select', label: 'Compact', options: ['none', 'compact', 'compactUp'] }
    ];

    // Initialize Settings UI
    settingsFields.forEach(f => {
      const div = document.createElement('div');
      div.className = 'mb-2';
      if (f.type === 'checkbox') {
        div.innerHTML = `<div class="form-check"><input class="form-check-input" type="checkbox" id="set-${f.id}"><label class="form-check-label">${f.label}</label></div>`;
      } else if (f.type === 'select') {
        div.innerHTML = `<label>${f.label}</label><select id="set-${f.id}" class="form-select">${f.options.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
      } else {
        div.innerHTML = `<label>${f.label}</label><input type="number" id="set-${f.id}" class="form-control">`;
      }
      settingsFormBody.appendChild(div);
    });

    function escapeHtml(unsafe) {
      return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatContent(rawContent, formatType) {
      switch(formatType) {
        case 'code': return `<pre class="h-100"><code>${escapeHtml(rawContent)}</code></pre>`;
        case 'markdown': return marked.parse(rawContent);
        default: return rawContent;
      }
    }

    function createBucket(name = null, options = { column: 12, margin: 5, cellHeight: 25, enableResize: true, enableMove: true, compact: 'none' }) {
      bucketCount++;
      const bucketId = `grid-${bucketCount}`;
      const wrapper = document.createElement('div');
      wrapper.className = 'bucket-wrapper';
      wrapper.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-2">
          <input type="text" class="form-control w-50 fw-bold border-0" value="${name || 'Bucket #' + bucketCount}">
          <div>
            <button class="btn btn-sm btn-outline-secondary settings-btn">⚙️</button>
            <button class="btn btn-sm btn-outline-danger remove-bucket">Delete</button>
          </div>
        </div>
        <div id="${bucketId}" class="grid-stack"></div>`;

      wrapper.querySelector('.settings-btn').onclick = () => {
        activeBucketId = bucketId;
        const g = grids.find(x => x.id === bucketId).grid;
        settingsFields.forEach(f => {
          const el = document.getElementById(`set-${f.id}`);
          if (f.type === 'checkbox') el.checked = !!g.opts[f.id];
          else el.value = g.opts[f.id] ?? '';
        });
        new bootstrap.Modal(document.getElementById('settingsModal')).show();
      };

      wrapper.querySelector('.remove-bucket').onclick = () => {
        const idx = grids.findIndex(g => g.id === bucketId);
        grids[idx].grid.destroy(); grids.splice(idx, 1); wrapper.remove();
      };

      mainContainer.appendChild(wrapper);
      const grid = GridStack.init({ ...options, acceptWidgets: true }, `#${bucketId}`);
      grids.push({ id: bucketId, grid });
    }

    function addWidgetToGrid(grid, options, rawContent = "New Widget", formatType = "html") {
      const widget = grid.addWidget({ w: 2, h: 2, ...options });
      widget.rawContent = rawContent;
      widget.formatType = formatType;
      const contentEl = widget.querySelector('.grid-stack-item-content');

      // Function to render the normal display state
      function renderViewMode() {
        const editButtonHtml = formatType === 'html' ? '' : `<span class="widget-action edit-widget" title="Edit">✎</span>`;

        contentEl.innerHTML = `
          <div class="widget-body">${formatContent(widget.rawContent, widget.formatType)}</div>
          ${editButtonHtml}
          <span class="widget-action remove-widget" title="Delete">×</span>
        `;

        contentEl.querySelector('.remove-widget').onclick = () => grid.removeWidget(widget);

        if (formatType !== 'html') {
          contentEl.querySelector('.edit-widget').onclick = renderEditMode;
        }
      }

      // Function to render the active text editor state
      function renderEditMode() {
        contentEl.innerHTML = `
          <textarea class="edit-textarea">${widget.rawContent}</textarea>
          <span class="widget-action save-widget" title="Save">✓</span>
          <span class="widget-action remove-widget" title="Delete">×</span>
        `;

        const textarea = contentEl.querySelector('.edit-textarea');

        // Updates the source content dynamically on every keystroke
        textarea.addEventListener('input', (e) => {
          widget.rawContent = e.target.value;
        });

        contentEl.querySelector('.save-widget').onclick = renderViewMode;
        contentEl.querySelector('.remove-widget').onclick = () => grid.removeWidget(widget);
      }

      renderViewMode();
    }

    // Event Listeners for UI Logic
    document.getElementById('add-bucket').addEventListener('click', () => createBucket());

    document.getElementById('add-widget').addEventListener('click', () => {
      if (!grids.length) return alert("Create a bucket first!");
      const text = document.getElementById('widget-text').value || "New Widget";
      const format = document.getElementById('widget-format').value;
      addWidgetToGrid(grids[grids.length - 1].grid, {}, text, format);
      document.getElementById('widget-text').value = '';
    });

    document.getElementById('export-json').addEventListener('click', () => {
      const data = { buckets: grids.map(b => ({
        name: b.grid.el.parentElement.querySelector('input').value,
        options: b.grid.opts,
        widgets: b.grid.save(false).map(n => ({ x: n.x, y: n.y, w: n.w, h: n.h, rawContent: n.el.rawContent, formatType: n.el.formatType }))
      })) };
      document.getElementById('json-textarea').value = JSON.stringify(data, null, 2);
    });

    document.getElementById('import-json').addEventListener('click', () => {
      try {
        const data = JSON.parse(document.getElementById('json-textarea').value);
        mainContainer.innerHTML = ''; grids.length = 0; bucketCount = 0;
        data.buckets.forEach(b => {
          createBucket(b.name, b.options);
          const gridObj = grids[grids.length - 1].grid;
          b.widgets.forEach(w => addWidgetToGrid(gridObj, w, w.rawContent, w.formatType));
        });
      } catch (e) { alert("Import failed: " + e.message); }
    });

    createBucket("Initial Bucket");
  </script>
</body>
</html>
